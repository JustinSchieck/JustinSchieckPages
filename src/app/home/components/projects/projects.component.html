<section
  id="projects"
  class="scroll-mt-20 py-24 px-6 sm:px-12 bg-[#11111a] text-white border-t border-gray-700"
>
  <div
    class="min-h-[80vh] flex items-start md:items-center justify-center flex-col max-w-7xl mx-auto"
  >
    <h2 class="text-3xl font-bold mb-10 text-primary">Projects</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 w-full">
      <div
        *ngFor="let project of projects"
        class="relative group cursor-pointer"
        (click)="openModal.emit(project)"
      >
        <!-- Project card with conditional rendering -->
        <div
          *ngIf="project.image"
          class="w-full h-80 overflow-hidden rounded-lg shadow-lg"
        >
          <img
            [src]="project.image"
            [alt]="project.title"
            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
          />
        </div>
        <div
          *ngIf="!project.image"
          class="w-full h-80 bg-gradient-to-br from-gray-800 to-gray-900 rounded-lg shadow-lg flex items-center justify-center p-6 transition-transform duration-300 group-hover:scale-105 border border-gray-700"
        >
          <div class="text-center">
            <div class="text-primary text-5xl mb-4">
              <i class="fa-solid fa-code"></i>
            </div>
            <h3 class="text-white text-2xl font-semibold">
              {{ project.title }}
            </h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Project Modal -->
    <div
      *ngIf="selectedProject"
      class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 transition-opacity duration-300"
      (click)="closeModal.emit()"
    >
      <div
        class="bg-gray-900 text-white rounded-lg p-8 max-w-2xl w-full text-left relative shadow-xl transform scale-95 opacity-0 animate-fade-in overflow-y-auto max-h-[90vh]"
        (click)="$event.stopPropagation()"
      >
        <button
          class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl"
          (click)="closeModal.emit()"
        >
          &times;
        </button>
        <!-- Modal content: title, description, image, link, etc. -->
        <div class="mb-6">
          <h3 class="text-2xl font-bold mb-2">{{ selectedProject.title }}</h3>
          <p class="mb-4">{{ selectedProject.description }}</p>
          <img
            *ngIf="selectedProject.image"
            [src]="selectedProject.image"
            [alt]="selectedProject.title"
            class="w-full rounded-lg mb-4"
          />
          <a
            *ngIf="selectedProject.link"
            [href]="selectedProject.link"
            target="_blank"
            rel="noopener"
            class="inline-block mt-2 text-primary hover:underline"
          >
            View Project
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
