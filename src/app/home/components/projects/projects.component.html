<section
  id="projects"
  class="scroll-mt-20 py-24 px-6 sm:px-12 bg-[#11111a] text-white border-t border-gray-700"
>
  <div
    class="projects-container min-h-[80vh] flex items-start md:items-center justify-center flex-col max-w-7xl mx-auto"
  >
    <h2 class="projects-title text-3xl font-bold mb-10 text-primary">
      Projects
    </h2>
    <div class="projects-grid">
      <div
        *ngFor="let project of projects"
        class="project-card group"
        (click)="openModal(project)"
      >
        <!-- If project has an image -->
        <div *ngIf="project.image" class="mb-4 relative">
          <img
            [src]="project.image"
            [alt]="project.title"
            class="w-full object-cover rounded-lg"
          />
          <!-- Hover overlay for desktop -->
          <div
            class="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none sm:flex"
          >
            <span class="text-white text-xl font-bold text-center px-4">
              {{ project.title }}
            </span>
          </div>
          <!-- Always show title below image for mobile -->
          <h3 class="text-xl font-semibold text-center mb-2 mt-2 sm:hidden">
            <ng-container *ngIf="project.link; else plainTitleImg">
              <a
                [href]="project.link"
                target="_blank"
                rel="noopener"
                class="text-primary hover:underline"
                (click)="$event.stopPropagation()"
              >
                {{ project.title }}
              </a>
            </ng-container>
            <ng-template #plainTitleImg>
              <span class="text-primary hover:underline">
                {{ project.title }}
              </span>
            </ng-template>
          </h3>
        </div>

        <!-- If project does NOT have an image -->
        <div
          *ngIf="!project.image"
          class="w-full h-80 bg-gradient-to-br from-gray-800 to-gray-900 rounded-lg shadow-lg flex items-center justify-center p-6 transition-transform duration-300 group-hover:scale-105 border border-gray-700"
        >
          <div class="text-center">
            <div class="text-primary text-5xl mb-4">
              <i class="fa-solid fa-code"></i>
            </div>
            <h3 class="text-xl font-semibold text-center mb-2">
              <ng-container *ngIf="project.link; else plainTitleNoImg">
                <a
                  [href]="project.link"
                  target="_blank"
                  rel="noopener"
                  class="text-primary hover:underline"
                  (click)="$event.stopPropagation()"
                >
                  {{ project.title }}
                </a>
              </ng-container>
              <ng-template #plainTitleNoImg>
                <span class="text-primary hover:underline">
                  {{ project.title }}
                </span>
              </ng-template>
            </h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Reusable Modal for Project Details -->
    <app-modal [open]="!!selectedProject" (close)="closeModal()">
      <ng-container *ngIf="selectedProject">
        <div class="mb-6">
          <h3 class="text-2xl font-bold mb-2">{{ selectedProject.title }}</h3>
          <p class="mb-4">{{ selectedProject.description }}</p>
          <img
            *ngIf="selectedProject.image"
            [src]="selectedProject.image"
            [alt]="selectedProject.title"
            class="w-full rounded-lg mb-4"
          />
          <a
            *ngIf="selectedProject.link"
            [href]="selectedProject.link"
            target="_blank"
            rel="noopener"
            class="inline-block mt-2 text-primary hover:underline"
          >
            View Project
          </a>
        </div>
      </ng-container>
    </app-modal>
  </div>
</section>
